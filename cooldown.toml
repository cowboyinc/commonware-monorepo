cooldown_minutes = 10080
enforcement = "strict"
lockfile_baseline = "ignore"
cache_dir = "target/cargo-cooldown"

# RUSTSEC-2026-0387: no cooled release fixes crypto-bigint's secret-dependent
# timing. This exact upstream security patch was published 2026-10-23.
# Remove after 2026-10-30; all other new releases retain the seven-day delay.
[[allow.exact]]
crate = "crypto-bigint"
version = "0.7.6"
